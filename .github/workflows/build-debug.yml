name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - rplusgram-dev
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "handoffs/**"

permissions:
  contents: read

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build afat debug
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Show toolchain
        shell: bash
        run: |
          java -version
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --console=plain \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            :TMessagesProj_App:assembleAfatDebug

      - name: List APK
        if: success()
        shell: bash
        run: |
          find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' \
            -printf '%p %s bytes\n'
          sha256sum TMessagesProj_App/build/outputs/apk/afat/debug/*.apk

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rplusgram-debug-${{ github.sha }}
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 14
